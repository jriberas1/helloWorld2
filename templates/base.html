<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap stylesheet for form and button styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link to the website's CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Main container shared by all pages -->
    <div class="page-container">

        <!-- White box containing the page heading and content -->
        <div class="content-box">

            <!-- Each page provides its own heading -->
            <h1 class="page-heading">{% block heading %}{% endblock %}</h1>

            <!-- Each page provides its own content -->
            {% block content %}{% endblock %}

        </div>
    </div>

</body>
</html>
