<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}{% endblock %}</title>

    <!-- Bootstrap stylesheet for the shared page design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Main container shared by all child templates -->
    <div class="container mt-5 mb-5">
        <div class="bg-white p-4 rounded shadow-sm">

            <!-- Each child template provides its own heading -->
            <h1 class="mb-4">{% block page_head %}{% endblock %}</h1>

            <!-- Each child template provides its own page content -->
            {% block page_content %}{% endblock %}

        </div>
    </div>
</body>
</html>
